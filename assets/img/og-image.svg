<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092f4d" />
      <stop offset="100%" stop-color="#002540" />
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1fa7a6" />
      <stop offset="100%" stop-color="#00696c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle corner glow -->
  <circle cx="1080" cy="90" r="320" fill="#1C8D90" opacity="0.10" />
  <circle cx="120" cy="560" r="260" fill="#1C8D90" opacity="0.07" />

  <!-- Wordmark -->
  <text x="80" y="150" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="1" fill="#ffffff">iKITES<tspan font-weight="600" fill="#1fa7a6"> / SERVICES</tspan></text>

  <!-- Teal accent rule -->
  <rect x="82" y="210" width="120" height="6" rx="3" fill="url(#teal)" />

  <!-- Headline -->
  <text x="80" y="340" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-1" fill="#ffffff">From idea to market.</text>

  <!-- Sub line -->
  <text x="82" y="420" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="400" fill="#cfe3e6">Deep-tech engineering studio</text>
  <text x="82" y="478" font-family="'IBM Plex Mono', 'Consolas', monospace" font-size="28" font-weight="500" letter-spacing="1" fill="#1fa7a6">Agentic AI &#183; Computer Vision &#183; Embedded Systems</text>

  <!-- Bottom domain -->
  <text x="82" y="572" font-family="'IBM Plex Mono', 'Consolas', monospace" font-size="24" font-weight="400" letter-spacing="1" fill="#7fa8b8">services.ikites.ai</text>
</svg>
